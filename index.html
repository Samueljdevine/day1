<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Day 1" />
    <meta name="description" content="Which block of the routine is on right now, how long is left, and what comes next." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Day 1</title>
  </head>
  <body>
    <main id="app">
      <header class="header">
        <span class="header-left">
          <span id="hdr-date">—</span>
          <button id="plan-btn" class="icon-btn" type="button" aria-label="Show today's schedule" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M4 6h3M4 12h3M4 18h3" />
              <rect x="10" y="4" width="10" height="4" rx="1.5" />
              <rect x="10" y="10" width="7" height="4" rx="1.5" />
              <rect x="10" y="16" width="10" height="4" rx="1.5" />
            </svg>
          </button>
        </span>
        <span id="hdr-day">—</span>
      </header>
      <div id="program-bar" class="program-bar" hidden><div id="program-fill" class="program-fill"></div></div>

      <section id="now" class="now" data-category="rest" aria-live="off">
        <div class="now-meta">
          <span id="now-cat"></span>
          <span id="now-range"></span>
        </div>
        <div class="now-top">
          <span id="now-title">—</span>
          <span id="now-tag" class="now-tag" hidden>Preview</span>
        </div>
        <div id="now-countdown" class="countdown">00:00</div>
        <div id="now-until" class="until">&nbsp;</div>
        <p id="now-note" class="note"></p>
        <div class="bar"><div id="now-bar" class="bar-fill"></div></div>
      </section>

      <div id="strip" class="strip" aria-label="Today at a glance"></div>

      <div id="next" class="next">&nbsp;</div>

      <section class="top3">
        <h2>Top 3 for today</h2>
        <div id="top3-today" class="top3-list"></div>
        <div id="top3-tomorrow-wrap" hidden>
          <h2>Tomorrow's top 3</h2>
          <div id="top3-tomorrow" class="top3-list"></div>
        </div>
      </section>

      <section class="learn">
        <div id="learn-wrap" hidden>
          <label for="learn-input">What did you learn?</label>
          <input id="learn-input" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" />
        </div>
        <div id="learn-streak" class="streak">Learning streak: 0 days</div>
      </section>

      <section class="day">
        <div class="day-head"><span>Today</span><span id="day-count"></span></div>
        <ol id="day-list"></ol>
      </section>

      <footer class="footer">
        <button id="wake-btn" class="pill" type="button" aria-pressed="false" aria-label="Keep screen awake" hidden>Keep awake</button>
        <button id="alerts-btn" class="pill" type="button" aria-pressed="false">Block alerts</button>
        <button id="reset-link" class="pill pill-quiet" type="button">Reset today</button>
      </footer>
    </main>

    <div id="plan" class="plan" role="dialog" aria-modal="true" aria-labelledby="plan-title" hidden>
      <div class="plan-inner">
        <div class="plan-head">
          <div>
            <div id="plan-title" class="plan-title">Today's plan</div>
            <div id="plan-sub" class="plan-sub"></div>
          </div>
          <button id="plan-close" class="icon-btn" type="button" aria-label="Close schedule">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
        <div id="plan-body" class="plan-body">
          <ol id="plan-list" class="plan-list"></ol>
        </div>
        <div id="plan-totals" class="plan-totals"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
